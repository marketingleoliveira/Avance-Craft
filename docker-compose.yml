version: '3.8'

services:
  habblet-mine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habblet-mine-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Credenciais Lovable Cloud (Supabase)
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      
      # Integrações
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - PLUGIN_SECRET=${PLUGIN_SECRET}
      
      # Ambiente
      - NODE_ENV=production
      - PORT=3000
    networks:
      - habblet-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  habblet-network:
    driver: bridge
