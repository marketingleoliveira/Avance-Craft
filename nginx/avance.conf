upstream avance_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name avance.com.br www.avance.com.br;

    # Redirecionar HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avance.com.br www.avance.com.br;

    # Configuração SSL (Caminhos padrão Certbot)
    # ssl_certificate /etc/letsencrypt/live/avance.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/avance.com.br/privkey.pem;

    # Segurança
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compressão Gzip
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://avance_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache para Assets Estáticos (Vite/TanStack Start)
    location /_build/assets/ {
        proxy_pass http://avance_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/avance.access.log;
    error_log /var/log/nginx/avance.error.log;
}

# Subdomínio de API (Opcional, se quiser separar do domínio principal)
server {
    listen 443 ssl http2;
    server_name api.avance.com.br;
    
    location / {
        proxy_pass http://avance_app/api/;
        proxy_set_header Host $host;
        # ... outras configs de proxy ...
    }
}
